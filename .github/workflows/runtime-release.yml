name: Build static release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'http://47.117.190.250' }}

      - name: Smoke test static output
        shell: bash
        run: |
          test -f dist/client/index.html
          python3 -m http.server 3000 --directory dist/client >/tmp/yubai-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null && \
               curl -fsS http://127.0.0.1:3000/about.html >/dev/null && \
               curl -fsS http://127.0.0.1:3000/posts.html >/dev/null && \
               curl -fsS http://127.0.0.1:3000/posts/notes-are-a-conversation.html >/dev/null && \
               curl -fsS http://127.0.0.1:3000/studio/posts/new.html >/dev/null && \
               curl -fsS http://127.0.0.1:3000/rss.xml >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/yubai-static.log
          exit 1

      - name: Package static site
        shell: bash
        run: |
          tar -C dist/client -czf /tmp/yubai-notes-static.tar.gz .
          cd /tmp
          sha256sum yubai-notes-static.tar.gz > SHA256SUMS

      - name: Publish GitHub Pages
        shell: bash
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PAGES_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git clone --depth 1 git@github.com:yuyongbo01/yuyongbo01.github.io.git /tmp/pages-deploy
          git -C /tmp/pages-deploy rm -rf .
          cp -a dist/client/. /tmp/pages-deploy/
          git -C /tmp/pages-deploy add -A
          if git -C /tmp/pages-deploy diff --cached --quiet; then
            echo "GitHub Pages is already current."
          else
            git -C /tmp/pages-deploy -c user.name=github-actions \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "Publish site from ${GITHUB_SHA}"
            git -C /tmp/pages-deploy push origin main
          fi

      - name: Publish lightweight static branch
        shell: bash
        run: |
          mkdir /tmp/runtime-static
          cp /tmp/yubai-notes-static.tar.gz /tmp/SHA256SUMS /tmp/runtime-static/
          git switch --orphan runtime-static
          git rm -rf --ignore-unmatch .
          cp /tmp/runtime-static/* .
          git add SHA256SUMS yubai-notes-static.tar.gz
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Publish static deployment bundle"
          git push origin HEAD:runtime-static --force
